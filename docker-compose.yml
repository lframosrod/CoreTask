services:
  backend-springboot:
    build:
      context: ./backend-springboot
      dockerfile: Dockerfile
    container_name: coretask-backend
    restart: always
    environment:
      # Se conecta al servicio llamado 'postgres'
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coretask_db
      SPRING_DATASOURCE_USERNAME: task_admin
      SPRING_DATASOURCE_PASSWORD: task_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - postgres
    networks:
      - coretask-net

  frontend-angular:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    container_name: coretask-frontend
    restart: always
    depends_on:
      - backend-springboot
    networks:
      - coretask-net

  nginx:
    image: nginx:alpine
    container_name: coretask-nginx
    restart: always
    ports:
      - "8000:80"
    volumes:
      # Mapea la carpeta local ./nginx al directorio de configuración del contenedor
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - frontend-angular
      - backend-springboot
    networks:
      - coretask-net

  postgres:
    image: postgres:15-alpine
    container_name: coretask-db
    restart: always
    environment:
      POSTGRES_USER: task_admin
      POSTGRES_PASSWORD: task_password
      POSTGRES_DB: coretask_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - coretask-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: coretask-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@coretask.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      # Persistencia de servidores y configuraciones de pgAdmin
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - coretask-net

volumes:
  pgdata:
  pgadmin_data:

networks:
  coretask-net:
    driver: bridge