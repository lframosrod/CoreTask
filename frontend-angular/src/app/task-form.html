<!-- Formulario -->
<form (ngSubmit)="submitTask()" style="display: flex; gap: 15px; align-items: center; width: 100%; flex-wrap: wrap;">

  <mat-form-field appearance="outline" style="flex: 2; min-width: 250px;" subscriptSizing="dynamic">
    <mat-label>Título de la tarea</mat-label>
    <input matInput name="title" [(ngModel)]="newTask.title" required>
  </mat-form-field>

  <mat-form-field appearance="outline" style="flex: 1; min-width: 150px;" subscriptSizing="dynamic">
    <mat-label>Prioridad</mat-label>
    <mat-select name="priority" [(ngModel)]="newTask.priority">
      <mat-option [value]="3">🔴 Alta</mat-option>
      <mat-option [value]="2">🟡 Media</mat-option>
      <mat-option [value]="1">🟢 Baja</mat-option>
    </mat-select>
  </mat-form-field>

  <button mat-flat-button type="submit" [disabled]="!newTask.title"
    style="height: 48px; background-color: #005cbb; color: white; border-radius: 12px; padding: 0 30px; font-weight: 500; font-size: 16px;">
    Guardar
  </button>

</form>
