<mat-card style="margin-bottom: 20px;">
  <mat-card-header>
    <mat-card-title>Nueva Tarea</mat-card-title>
  </mat-card-header>
  
  <mat-card-content style="margin-top: 15px;">
    <!-- Formulario que ejecuta submitTask() al presionar Enter o el botón -->
    <form (ngSubmit)="submitTask()" style="display: flex; gap: 15px; align-items: center;">
      
      <mat-form-field appearance="outline" style="flex: 1;">
        <mat-label>Título de la tarea</mat-label>
        <input matInput name="title" [(ngModel)]="newTask.title" required>
      </mat-form-field>

      <mat-form-field appearance="outline" style="flex: 2;">
        <mat-label>Descripción (Opcional)</mat-label>
        <input matInput name="description" [(ngModel)]="newTask.description">
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" [disabled]="!newTask.title" style="padding: 25px 20px;">
        Guardar
      </button>

    </form>
  </mat-card-content>
</mat-card>
