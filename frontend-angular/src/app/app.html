<mat-toolbar color="primary">
  <span>Gestor de Tareas CoreTask</span>
</mat-toolbar>

<!-- Un solo contenedor principal para todo -->
<div style="padding: 20px; max-width: 800px; margin: 0 auto;">
  
  <!-- 1. Formulario modular para crear tareas -->
  <app-task-form (taskCreated)="loadTasks()"></app-task-form>

  <!-- 2. Tarjeta con la tabla de tareas -->
  <mat-card>
    <mat-card-header>
      <mat-card-title>Mis Tareas</mat-card-title>
      <mat-card-subtitle>Listado en tiempo real desde PostgreSQL</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content style="margin-top: 15px;">
      
      <table mat-table [dataSource]="backendData()" class="mat-elevation-z2" style="width: 100%;">

        <!-- Columna ID -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> No. </th>
          <td mat-cell *matCellDef="let task"> {{task.id}} </td>
        </ng-container>

        <!-- Columna Título -->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef> Título </th>
          <td mat-cell *matCellDef="let task"> <strong>{{task.title}}</strong> </td>
        </ng-container>

        <!-- Columna Descripción -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef> Descripción </th>
          <td mat-cell *matCellDef="let task"> {{task.description}} </td>
        </ng-container>

        <!-- Columna Estado -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Estado </th>
          <td mat-cell *matCellDef="let task"> 
            {{ task.completed ? '✅ Completada' : '⏳ Pendiente' }} 
          </td>
        </ng-container>
        
        <!-- Columna Acciones -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef> Acciones </th>
          <td mat-cell *matCellDef="let task">
        
            <button mat-button [color]="task.completed ? 'warn' : 'primary'" (click)="toggleTask(task)">
              {{ task.completed ? 'Desmarcar' : 'Completar' }}
            </button>

            <!-- NUEVO: Botón de Eliminar -->
            <button mat-button color="warn" (click)="deleteTask(task.id)" style="margin-left: 8px;">
              Eliminar
            </button>

          </td>
        </ng-container>

        <!-- Renderizado de las cabeceras y filas -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      @if (backendData().length === 0) {
        <p style="text-align: center; margin-top: 20px; color: gray;">
          Cargando tareas o no hay registros...
        </p>
      }

    </mat-card-content>
  </mat-card>

</div>
