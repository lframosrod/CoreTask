<!-- Barra superior principal -->
<mat-toolbar color="primary">
  <span>Gestor de Tareas CoreTask</span>
</mat-toolbar>

<!-- Contenedor centrado -->
<div style="padding: 20px; max-width: 800px; margin: 0 auto;">
  
  <!-- Tarjeta de presentación -->
  <mat-card>
    <mat-card-header>
      <mat-card-title>Conexión Exitosa</mat-card-title>
      <mat-card-subtitle>Angular 17+ y Spring Boot con Material Design</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content style="margin-top: 15px;">
      <p>Datos puros traídos desde PostgreSQL:</p>
      <pre style="background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto;">
        {{ backendData() | json }}
      </pre>
    </mat-card-content>
  </mat-card>

</div>
